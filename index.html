<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Lingkod Presenter</title>
    <link rel="preload" href="./bg.webp" as="image">
    <link rel="preload" href="./Raleway/static/Raleway-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./Raleway/static/Raleway-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./Raleway/static/Raleway-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./Raleway/static/Raleway-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="manifest" href="./manifest.webmanifest">
    <script>
        // A saved custom background loads async from IndexedDB; hide the default until it arrives so it never flashes
        try { if (localStorage.getItem('lingkod-custom-bg')) document.documentElement.classList.add('custom-bg-pending'); } catch {}
    </script>
    <link rel="icon" href="./icon.png" type="image/png">
    <link rel="apple-touch-icon" href="./icon.png">
    <style>
        @font-face {
            font-family: 'Raleway';
            src: url('./Raleway/static/Raleway-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Raleway';
            src: url('./Raleway/static/Raleway-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Raleway';
            src: url('./Raleway/static/Raleway-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Raleway';
            src: url('./Raleway/static/Raleway-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        /* ============================================================
           DESIGN TOKENS — Lyric Presenter (Transparent Nav)
        ============================================================ */
        :root {
            --color-primary: #0066cc;
            --color-primary-focus: #0071e3;
            --color-primary-on-dark: #2997ff;
            --color-body-on-dark: #ffffff;
            --color-text-muted: rgba(255, 255, 255, 0.66);
            --color-highlight: #FAD539;

            /* Shared "dark glass" chrome for pills, dropdown and panels */
            --chrome-bg: rgba(22, 22, 26, 0.8);
            --chrome-bg-strong: rgba(22, 22, 26, 0.92);
            --chrome-border: rgba(255, 255, 255, 0.12);
            --chrome-blur: saturate(180%) blur(20px);
            --chrome-shadow: 0 6px 24px rgba(0, 0, 0, 0.22), 0 1px 3px rgba(0, 0, 0, 0.18);
            --hover-bg: rgba(255, 255, 255, 0.08);
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

            /* Lyric panel: dark enough for projector contrast on light backgrounds */
            --panel-bg: radial-gradient(ellipse at center, rgba(12, 12, 18, 0.58) 0%, rgba(12, 12, 18, 0.72) 100%);
            --panel-border: rgba(255, 255, 255, 0.14);

            --font-display: "Raleway", "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            --font-body: "Raleway", "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

            --type-caption: 400 14px/1.43 var(--font-body);
            --type-body: 400 17px/1.47 var(--font-body);
            --type-body-strong: 600 17px/1.24 var(--font-body);
            --type-button: 500 14px/1.29 var(--font-body);
        }

        ::selection {
            background: rgba(41, 151, 255, 0.45);
            color: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            font: var(--type-body);
            letter-spacing: -0.374px;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: var(--color-body-on-dark);
            -webkit-user-select: none;
            user-select: none;
            background-image: var(--custom-background-image, url('./bg.webp'));
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }

        html.custom-bg-pending body {
            background-image: none;
            background-color: #000;
        }

        /* ============================================================
           TRANSPARENT GLOBAL TOP NAV
        ============================================================ */
        .presenter-navigation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 18px 20px 0;
            z-index: 100;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            column-gap: 12px;
            pointer-events: none;
        }

        .presenter-navigation > * {
            pointer-events: auto;
        }

        .section-navigation-area {
            grid-column: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        body.home-screen-active #lyricDisplayPanel,
        body.home-screen-active #sectionNameBadge,
        body.home-screen-active #sectionCounter {
            visibility: hidden;
        }

        body.home-screen-active #welcomeMessage {
            display: none;
        }

        /* ============================================================
           MAGIC SEARCH / TITLE BAR + DROPDOWN
        ============================================================ */
        .song-search-container {
            position: relative;
            grid-column: 2;
            justify-self: center;
            width: min(var(--search-pill-w, 900px), calc(100vw - 360px));
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: width 200ms ease;
        }

        .song-search-bar {
            position: relative;
            height: 70px;
            width: 100%;
            max-width: var(--search-pill-w, 720px);
            background: var(--chrome-bg);
            backdrop-filter: var(--chrome-blur);
            -webkit-backdrop-filter: var(--chrome-blur);
            border: 1px solid var(--chrome-border);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 12px;
            cursor: text;
            transition: background-color 160ms ease, box-shadow 160ms ease, border-color 160ms ease, max-width 240ms var(--ease-out);
            box-shadow: var(--chrome-shadow);
        }

        .song-search-bar:focus-within {
            background: var(--chrome-bg-strong);
            border-color: rgba(41, 151, 255, 0.7);
            box-shadow: var(--chrome-shadow), 0 0 0 3px rgba(41, 151, 255, 0.28);
        }

        .song-search-icon {
            width: 28px;
            height: 28px;
            color: var(--color-text-muted);
            flex-shrink: 0;
        }

        .song-search-input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            font: var(--type-body);
            font-size: 28px;
            letter-spacing: -0.374px;
            color: var(--color-body-on-dark);
            outline: none;
            padding: 0;
            -webkit-user-select: text;
            user-select: text;
            caret-color: var(--color-primary-on-dark);
        }

        .song-search-input::placeholder {
            color: var(--color-text-muted);
        }

        .selected-song-search-result-title {
            flex: 1;
            min-width: 0;
            text-align: center;
            font: var(--type-body-strong);
            font-size: 28px;
            letter-spacing: 3.4px;
            text-transform: uppercase;
            color: var(--color-body-on-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .song-search-bar.song-selected .song-search-input {
            display: none;
        }

        .song-search-bar.song-selected .song-search-icon {
            display: none;
        }

        .song-search-bar.song-selected .selected-song-search-result-title {
            display: block;
        }

        .song-search-bar.song-selected {
            cursor: pointer;
            background: var(--chrome-bg-strong);
        }

        .song-search-bar.song-selected:hover {
            border-color: rgba(255, 255, 255, 0.24);
        }

        .clear-song-search-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-text-muted);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            transition: transform 120ms ease, color 160ms ease, background-color 160ms ease;
        }

        .clear-song-search-button.visible {
            display: flex;
        }

        .clear-song-search-button:active {
            transform: translateY(-50%) scale(0.92);
        }

        .clear-song-search-button:hover {
            color: var(--color-body-on-dark);
            background: rgba(255, 255, 255, 0.18);
        }

        .clear-song-search-button:focus-visible {
            outline: 2px solid var(--color-primary-on-dark);
            outline-offset: 2px;
        }

        .clear-song-search-button svg {
            width: 45%;
            height: 45%;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        html.presentation-cursor-hidden,
        html.presentation-cursor-hidden * {
            cursor: none !important;
        }

        /* Dropdown song list */
        .song-search-results {
            position: absolute;
            top: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 720px;
            max-height: min(560px, calc(100vh - 140px));
            max-height: min(560px, calc(100dvh - 140px));
            overflow-y: auto;
            overscroll-behavior: contain;
            background: var(--chrome-bg-strong);
            backdrop-filter: var(--chrome-blur);
            -webkit-backdrop-filter: var(--chrome-blur);
            border: 1px solid var(--chrome-border);
            border-radius: 22px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.2);
            padding: 8px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateX(-50%) translateY(-6px);
            transition: opacity 180ms var(--ease-out), transform 220ms var(--ease-out), visibility 180ms;
            z-index: 101;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
        }

        .song-search-results.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .song-search-results:empty {
            display: none;
        }

        .song-search-results::-webkit-scrollbar {
            width: 8px;
        }

        .song-search-results::-webkit-scrollbar-track {
            background: transparent;
        }

        .song-search-results::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .song-search-results::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.28);
            background-clip: padding-box;
        }

        .song-search-result {
            margin-bottom: 2px;
        }

        .song-search-result-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 20px;
            font: var(--type-body);
            font-size: 22px;
            letter-spacing: -0.374px;
            color: var(--color-body-on-dark);
            border-radius: 14px;
            cursor: pointer;
            transition: background-color 120ms ease, transform 120ms ease;
        }

        .song-search-result-title:hover {
            background: var(--hover-bg);
        }

        .song-search-result-title.keyboard-highlighted {
            background: rgba(41, 151, 255, 0.22);
        }

        .song-search-result-title:active {
            transform: scale(0.99);
        }

        .song-search-result-title mark {
            background: none;
            color: var(--color-highlight);
        }

        .song-search-result-title.selected-song {
            font-weight: 600;
        }

        /* "Presenting now" tag on the song currently on screen */
        .song-search-result-title.selected-song::after {
            content: "Presenting now";
            flex-shrink: 0;
            font: var(--type-button);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-primary-on-dark);
        }

        .search-empty-message {
            color: var(--color-text-muted);
            text-align: center;
            padding: 28px 16px;
            font: var(--type-body);
        }

        .search-result-count {
            padding: 8px 20px 6px;
            font: var(--type-caption);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
            color: var(--color-text-muted);
        }

        /* ============================================================
           MAIN STAGE
        ============================================================ */
        .presentation-stage {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 1;
            touch-action: pan-y;
            padding: 110px 0 48px;
            box-sizing: border-box;
        }

        .lyric-display-panel {
            max-width: 90%;
            width: auto;
            display: inline-block;
            padding: 0.5rem 1.3rem;
            border-radius: 40px;
            transition: none;
            will-change: auto;
            position: relative;
        }

        .section-name-badge {
            justify-self: start;
            align-self: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--chrome-bg);
            backdrop-filter: var(--chrome-blur);
            -webkit-backdrop-filter: var(--chrome-blur);
            -webkit-user-select: none;
            user-select: none;
            height: 70px;
            padding: 0 26px;
            border-radius: 9999px;
            font: var(--type-body-strong);
            font-size: 26px;
            letter-spacing: 0.12em;
            color: var(--color-body-on-dark);
            border: 1px solid var(--chrome-border);
            text-transform: uppercase;
            transition: opacity 200ms var(--ease-out);
            pointer-events: none;
            white-space: nowrap;
            box-shadow: var(--chrome-shadow);
            visibility: hidden;
            opacity: 0;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .section-name-badge.visible {
            visibility: visible;
            opacity: 1;
        }

        .lyric-content {
            color: #ffffff;
            font-weight: 600;
            line-height: 1.4;
            white-space: pre;
            word-break: keep-all;
            overflow-wrap: normal;
            font-family: var(--font-display);
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.45);
            font-kerning: normal;
            transition: opacity 0.14s ease, transform 0.18s var(--ease-out);
            -webkit-user-select: none;
            user-select: none;
        }

        .lyric-highlight-primary {
            color: var(--color-highlight);
        }

        /* [F1] marks cues like (Men), (2x), (echo): smaller so the sung words lead */
        .lyric-italic-emphasis {
            font-style: italic;
            font-weight: 400;
            font-size: 0.8em;
        }

        .lyric-display-panel.song-selected {
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .end-of-song-marker {
            display: inline-block;
            font-size: 0.55em;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            padding: 0.4em 0.6em;
        }

        /* ============================================================
           SLIDE COUNTER (nav, upper-right)
        ============================================================ */
        .section-counter {
            grid-column: 3;
            justify-self: end;
            align-self: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            background: var(--chrome-bg);
            backdrop-filter: var(--chrome-blur);
            -webkit-backdrop-filter: var(--chrome-blur);
            -webkit-user-select: none;
            user-select: none;
            height: 70px;
            padding: 0 26px;
            border-radius: 9999px;
            font: var(--type-body-strong);
            font-size: 26px;
            font-variant-numeric: tabular-nums lining-nums;
            letter-spacing: 0.04em;
            color: var(--color-body-on-dark);
            border: 1px solid var(--chrome-border);
            pointer-events: none;
            white-space: nowrap;
            box-shadow: var(--chrome-shadow);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .section-count {
            white-space: nowrap;
        }

        .section-count-total {
            color: var(--color-text-muted);
        }

        .section-counter.counter-hidden {
            visibility: hidden;
            opacity: 0;
        }

        /* ============================================================
           WELCOME MESSAGE
        ============================================================ */
        .welcome-message {
            display: none;
            color: var(--color-body-on-dark);
            font: var(--type-body);
            text-align: left;
            padding: 22px 32px;
            background: var(--chrome-bg-strong);
            backdrop-filter: var(--chrome-blur);
            -webkit-backdrop-filter: var(--chrome-blur);
            border: 1px solid var(--chrome-border);
            border-radius: 28px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
            width: min(560px, 90vw);
            /* Short landscape phones: scroll inside the card instead of clipping */
            max-height: calc(100vh - 140px);
            max-height: calc(100dvh - 140px);
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
        }

        .welcome-message.visible {
            display: block;
        }

        /* Action on the left, keys on the right: operators scan for the task, then read the key */
        .welcome-rows {
            display: grid;
            gap: 6px;
        }

        .welcome-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 16px;
            min-height: 36px;
            font-size: 15px;
        }

        .welcome-row dt,
        .welcome-row-label {
            color: var(--color-body-on-dark);
        }

        .welcome-row dd {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 4px;
        }

        .shortcut-or {
            padding: 0 4px;
            font-size: 13px;
            color: var(--color-text-muted);
        }

        .welcome-message kbd,
        .shortcut-gesture {
            display: inline-block;
            min-width: 28px;
            text-align: center;
            border-radius: 7px;
            padding: 3px 8px;
            font: var(--type-button);
            font-size: 13px;
            line-height: 1.4;
            white-space: nowrap;
        }

        .welcome-message kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom-width: 2px;
        }

        /* Mouse gestures are not keys: same footprint, dashed edge */
        .shortcut-gesture {
            border: 1px dashed rgba(255, 255, 255, 0.28);
            color: var(--color-text-muted);
        }

        .welcome-footer {
            display: grid;
            gap: 10px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .welcome-footer .welcome-row-label {
            color: var(--color-text-muted);
        }

        .welcome-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        .background-button {
            appearance: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-body-on-dark);
            cursor: pointer;
            font: var(--type-button);
            padding: 9px 16px;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 160ms ease, border-color 160ms ease, transform 120ms ease;
        }

        .background-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.22);
        }

        .background-button:active:not(:disabled) {
            transform: scale(0.97);
        }

        .background-button:focus-visible {
            outline: 2px solid var(--color-primary-on-dark);
            outline-offset: 2px;
        }

        .background-button:disabled {
            cursor: default;
            opacity: 0.4;
        }

        .background-button svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        /* The one outward action on the card gets the accent */
        .request-button {
            border-color: rgba(41, 151, 255, 0.55);
            background: rgba(41, 151, 255, 0.16);
        }

        .request-button:hover {
            background: rgba(41, 151, 255, 0.28);
        }

        .background-status {
            min-height: 1.43em;
            margin-top: 12px;
            color: var(--color-text-muted);
            font: var(--type-caption);
        }

        .background-status:empty {
            min-height: 0;
            margin-top: 0;
        }

        @media (max-width: 480px) {
            .welcome-message {
                padding: 24px 20px 18px;
            }
            .welcome-row {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 4px 0;
            }
            .welcome-row dd,
            .welcome-actions {
                justify-content: flex-start;
            }
        }

        /* ============================================================
           TRANSITIONS & ANIMATIONS
        ============================================================ */
        .lyric-content.section-transition-next-exit {
            opacity: 0;
            transform: translateX(-12px);
        }
        .lyric-content.section-transition-next-enter {
            opacity: 0;
            transform: translateX(12px);
        }
        .lyric-content.section-transition-previous-exit {
            opacity: 0;
            transform: translateX(12px);
        }
        .lyric-content.section-transition-previous-enter {
            opacity: 0;
            transform: translateX(-12px);
        }

                .lyric-content.end-of-song-feedback,
        .section-counter.end-of-song-feedback {
            animation: endPulse 0.4s ease-out;
        }

        @keyframes endPulse {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* ============================================================
           UPDATE BANNER
        ============================================================ */
        .update-available-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            max-width: calc(100vw - 32px);
            appearance: none;

<body>

<div class="presenter-navigation" id="presenterNavigation">
    <div class="section-navigation-area">

                <path d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z" fill="currentColor"/>
            </svg>

        <div class="welcome-message" id="welcomeMessage">

                <div class="welcome-row"><dt>Open search</dt><dd><kbd>Alt</kbd><kbd>Shift</kbd><kbd>F</kbd></dd></div>
                <div class="welcome-row"><dt>Home view</dt><dd><kbd>Alt</kbd><kbd>Shift</kbd><kbd>H</kbd></dd></div>
                <div class="welcome-row"><dt>Toggle fullscreen</dt><dd><span class="shortcut-gesture">Double-click</span></dd></div>

            </dl>

                    <span class="welcome-row-label">Song missing or wrong?</span>

                        <a class="background-button request-button" href="https://forms.gle/2r8T1VK9YNPn7kQ67" target="_blank" rel="noopener noreferrer">Send a request<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg><span class="visually-hidden"> (opens in a new tab)</span></a>
                    </div>
                </div>
                <div class="welcome-row">
                    <span class="welcome-row-label">Background</span>
                    <div class="welcome-actions">
                        <button class="background-button" id="uploadBackgroundButton" type="button">Upload PNG</button>
                        <button class="background-button" id="clearBackgroundButton" type="button" disabled>Reset to default</button>
                        <input id="backgroundFileInput" type="file" accept="image/png,.png" hidden>

<button class="update-available-banner" id="updateBanner" type="button">New version available — tap to refresh</button>

<script src="./songs.js"></script>
<script>
    const songDatabase = (typeof rawSongs !== 'undefined' && Array.isArray(rawSongs))
        ? [...rawSongs].sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }))
        : [];

    if (!songDatabase.length) {
        document.getElementById('songSearchResults').innerHTML =
            `<div class="search-empty-message">⚠️ Unable to load song database.<br><small>Check your connection and refresh.</small></div>`;
    }

    // Fold accents and drop apostrophes so "senor" finds "Señor" and "lords day" finds "Lord’s Day"
    function normalizeSearchText(text) {
        return text.normalize('NFD').replace(/[\u0300-\u036f'’‘]/g, '').toLowerCase();
    }

    // Folding changes length, so map the match back to the original title for highlighting
    function findTitleMatchRange(title, query) {
        let folded = '';
        const origin = [];
        for (let i = 0; i < title.length; i++) {
            for (const ch of normalizeSearchText(title[i])) {
                folded += ch;
                origin.push(i);
            }
        }
        const at = folded.indexOf(query);
        return at < 0 ? null : [origin[at], origin[at + query.length - 1] + 1];
    }

    const songSearchIndex = songDatabase.map(song => ({ song, normalizedTitle: normalizeSearchText(song.title) }));

    let currentSong = null;
    let currentSectionIndex = 0;
    let currentSearchTerm = "";
    let isTransitioning = false;
    let highlightedSearchIndex = -1;

    const songSearchContainer = document.getElementById("songSearchContainer");
    const songSearchBar = document.getElementById("songSearchBar");
    const songSearchInput = document.getElementById("songSearchInput");
    const selectedSongTitle = document.getElementById("selectedSongTitle");
    const clearSongSearchButton = document.getElementById("clearSongSearchButton");
    const songSearchResults = document.getElementById("songSearchResults");
    const lyricContent = document.getElementById("lyricContent");
    const sectionNameBadge = document.getElementById("sectionNameBadge");
    const lyricDisplayPanel = document.getElementById("lyricDisplayPanel");
    const presentationStage = document.getElementById("presentationStage");
    const sectionCounter = document.getElementById("sectionCounter");
    const sectionCount = document.getElementById("sectionCount");
    const welcomeMessage = document.getElementById("welcomeMessage");
    const uploadBackgroundButton = document.getElementById("uploadBackgroundButton");
    const clearBackgroundButton = document.getElementById("clearBackgroundButton");
    const backgroundFileInput = document.getElementById("backgroundFileInput");
    const backgroundStatus = document.getElementById("backgroundStatus");
    const updateBanner = document.getElementById("updateBanner");
    let updateAvailable = false;

    const BACKGROUND_DB_NAME = 'lyric-presenter';
    const BACKGROUND_STORE_NAME = 'settings';
    const BACKGROUND_KEY = 'custom-background';
    let backgroundObjectUrl = null;

    function setCustomBackgroundStatus(message) {
        backgroundStatus.textContent = message;
    }

    function openCustomBackgroundDatabase() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(BACKGROUND_DB_NAME, 1);
            request.onupgradeneeded = () => {
                if (!request.result.objectStoreNames.contains(BACKGROUND_STORE_NAME)) {
                    request.result.createObjectStore(BACKGROUND_STORE_NAME);
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error || new Error('Unable to open background storage.'));
        });
    }

    async function readSavedCustomBackground() {
        const db = await openCustomBackgroundDatabase();
        try {
            return await new Promise((resolve, reject) => {
                const request = db.transaction(BACKGROUND_STORE_NAME, 'readonly')
                    .objectStore(BACKGROUND_STORE_NAME)
                    .get(BACKGROUND_KEY);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error || new Error('Unable to read the saved background.'));
            });
        } finally {
            db.close();
        }
    }

    async function saveCustomBackground(file) {
        const db = await openCustomBackgroundDatabase();
        try {
            await new Promise((resolve, reject) => {
                const request = db.transaction(BACKGROUND_STORE_NAME, 'readwrite')
                    .objectStore(BACKGROUND_STORE_NAME)
                    .put(file, BACKGROUND_KEY);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error || new Error('Unable to save the background.'));
            });
        } finally {
            db.close();
        }
    }

    async function deleteCustomBackground() {
        const db = await openCustomBackgroundDatabase();
        try {
            await new Promise((resolve, reject) => {
                const request = db.transaction(BACKGROUND_STORE_NAME, 'readwrite')
                    .objectStore(BACKGROUND_STORE_NAME)
                    .delete(BACKGROUND_KEY);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error || new Error('Unable to clear the background.'));
            });
        } finally {
            db.close();
        }
    }

    function applyCustomBackgroundImage(image) {
        if (backgroundObjectUrl) URL.revokeObjectURL(backgroundObjectUrl);
        backgroundObjectUrl = URL.createObjectURL(image);
        document.body.style.setProperty('--custom-background-image', `url("${backgroundObjectUrl}")`);
        clearBackgroundButton.disabled = false;
    }

    function restoreDefaultBackgroundImage() {
        if (backgroundObjectUrl) URL.revokeObjectURL(backgroundObjectUrl);
        backgroundObjectUrl = null;
        document.body.style.removeProperty('--custom-background-image');
        clearBackgroundButton.disabled = true;
    }

    async function isValidPngFile(file) {
        if (!file || file.type !== 'image/png') return false;
        const signature = new Uint8Array(await file.slice(0, 8).arrayBuffer());
        return signature.length === 8 &&
            signature.every((byte, index) => byte === [137, 80, 78, 71, 13, 10, 26, 10][index]);
    }

    function initializeBackgroundControls() {
        uploadBackgroundButton.addEventListener('click', () => backgroundFileInput.click());
        backgroundFileInput.addEventListener('change', async () => {
            const [file] = backgroundFileInput.files;
            backgroundFileInput.value = '';
            if (!file) return;

            try {
                if (!(await isValidPngFile(file))) {
                    setCustomBackgroundStatus('Please select a valid PNG image.');
                    return;
                }
                await saveCustomBackground(file);
                rememberCustomBackground(true);
                applyCustomBackgroundImage(file);
                setCustomBackgroundStatus('Custom background saved on this device.');
            } catch (error) {
                console.error('Could not save custom background:', error);
                setCustomBackgroundStatus('Unable to save the background. Please try again.');
            }
        });
        clearBackgroundButton.addEventListener('click', async () => {
            try {
                await deleteCustomBackground();
                rememberCustomBackground(false);
                restoreDefaultBackgroundImage();
                setCustomBackgroundStatus('Custom background cleared.');
            } catch (error) {
                console.error('Could not clear custom background:', error);
                setCustomBackgroundStatus('Unable to clear the background. Please try again.');
            }
        });
    }

    // Hint for the <head> script so the next launch skips the default background flash
    function rememberCustomBackground(hasCustom) {
        try {
            if (hasCustom) localStorage.setItem('lingkod-custom-bg', '1');
            else localStorage.removeItem('lingkod-custom-bg');
        } catch {}
    }

    async function loadSavedCustomBackground() {
        try {
            const image = await readSavedCustomBackground();
            const hasCustom = image instanceof Blob && image.type === 'image/png';
            if (hasCustom) {
                applyCustomBackgroundImage(image);
                setCustomBackgroundStatus('Using your saved custom background.');
            }
            rememberCustomBackground(hasCustom);
        } catch (error) {
            console.error('Could not load custom background:', error);
            setCustomBackgroundStatus('Unable to load the saved background.');
        } finally {
            document.documentElement.classList.remove('custom-bg-pending');
        }
    }

    function escapeHtmlText(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' })[m] || m);
    }

    function filterSongsByTitle(query) {
        const normalizedQuery = normalizeSearchText(query.trim());
        if (!normalizedQuery) return [...songDatabase];
        return songSearchIndex
            .filter(({ normalizedTitle }) => normalizedTitle.includes(normalizedQuery))
            .map(({ song }) => song);
    }

    function updateSongSearchBar() {
        if (currentSong) {
            songSearchBar.classList.add('song-selected');
            selectedSongTitle.textContent = currentSong.title || '—';
            songSearchInput.value = currentSong.title || '';
            clearSongSearchButton.classList.remove('visible');
            fitSearchBarToSongTitle(currentSong.title);
        } else {
            songSearchBar.classList.remove('song-selected');
            selectedSongTitle.textContent = '—';
            clearSongSearchButton.classList.remove('visible');
            resetSongSearchBarWidth();
        }
    }

    function showSongSearchResults() {
        songSearchResults.classList.add('visible');
        songSearchInput.setAttribute('aria-expanded', 'true');
    }

    function hideSongSearchResults() {
        songSearchResults.classList.remove('visible');
        songSearchInput.setAttribute('aria-expanded', 'false');
        if (currentSong) {
            updateSongSearchBar();
        }
    }

    function updateSectionCounter() {
        if (currentSong?.sections?.length) {
            const total = currentSong.sections.length;
            const current = currentSectionIndex + 1;
            sectionCount.innerHTML = `${(current >= 1 && current <= total) ? current : '—'}<span class="section-count-total">/${total}</span>`;
        } else if (currentSong) {
            sectionCount.textContent = `0/0`;
        } else {
            sectionCount.textContent = `—/—`;
        }
        sectionCounter.classList.toggle('counter-hidden', !currentSong);
    }

    // Persistent off-screen span reused for lyric and title measurements (avoids DOM thrash)
    const lyricMeasureSpan = document.createElement('span');
    lyricMeasureSpan.style.position = 'absolute';
    lyricMeasureSpan.style.visibility = 'hidden';
    lyricMeasureSpan.style.whiteSpace = 'nowrap';
    lyricMeasureSpan.style.pointerEvents = 'none';
    document.body.appendChild(lyricMeasureSpan);

    function resizeLyricsToFitViewport() {
        const rawText = lyricContent.innerText;
        if (!rawText?.trim()) {
            lyricContent.style.fontSize = '';
            return;
        }

        const explicitLines = rawText.split('\n');
        const nonEmptyLines = explicitLines.filter(l => l.trim().length > 0);
        if (!nonEmptyLines.length) return;

        const containerStyle = getComputedStyle(lyricDisplayPanel);
        const padL = parseFloat(containerStyle.paddingLeft) || 0;
        const padR = parseFloat(containerStyle.paddingRight) || 0;
        const padT = parseFloat(containerStyle.paddingTop) || 0;
        const padB = parseFloat(containerStyle.paddingBottom) || 0;

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const isFullscreen = !!document.fullscreenElement;

        let horizMargin = 40;
        let maxWidth = vw - horizMargin - padL - padR - 20;
        maxWidth = Math.min(Math.max(maxWidth, 200), vw * 0.9);

        const presenterNavigationEl = document.getElementById('presenterNavigation');
        const navReserve = presenterNavigationEl ? presenterNavigationEl.offsetHeight + 22 : 110;
        const bottomMargin = isFullscreen ? 60 : 48;
        let maxHeight = vh - padT - padB - navReserve - bottomMargin - 20;
        maxHeight = Math.max(maxHeight, 150);

        let longestLineForSpacing = "";
        for (let line of explicitLines) {
            if (line.length > longestLineForSpacing.length) longestLineForSpacing = line;
        }
        let letterSpacing = '-0.15px';
        if (longestLineForSpacing.length > 55) letterSpacing = '-0.45px';
        else if (longestLineForSpacing.length > 45) letterSpacing = '-0.35px';
        else if (longestLineForSpacing.length > 35) letterSpacing = '-0.25px';

        const lyricStyle = getComputedStyle(lyricContent);
        lyricMeasureSpan.style.fontFamily = lyricStyle.fontFamily;
        lyricMeasureSpan.style.fontWeight = lyricStyle.fontWeight;
        lyricMeasureSpan.style.letterSpacing = letterSpacing;
        lyricMeasureSpan.style.textTransform = lyricStyle.textTransform;

        let absMax = 5.2;
        if (vw >= 1280 && vh >= 720) absMax = 5.0;
        else if (vh > 800) absMax = 5.2;
        else if (vw <= 600) absMax = 3.8;
        else absMax = 4.6;
        if (isFullscreen && vw >= 1600) absMax = 5.5;

        const minFont = 0.9;
        const refFont = 2.0;
        const lineH = 1.4;

        lyricMeasureSpan.style.fontSize = `${refFont}rem`;

        let maxLineWidth = 0;
        for (let line of explicitLines) {
            if (!line.length) continue;
            lyricMeasureSpan.textContent = line;
            maxLineWidth = Math.max(maxLineWidth, lyricMeasureSpan.getBoundingClientRect().width);
        }

        let fontByWidth = absMax;
        if (maxLineWidth > 0 && isFinite(maxLineWidth)) {
            const ideal = (maxWidth / maxLineWidth) * refFont;
            fontByWidth = Math.min(absMax, Math.max(minFont, ideal * 0.95));
        }

        const numLines = nonEmptyLines.length;
        let fontByHeight = absMax;
        if (numLines > 0) {
            let basePx = parseFloat(getComputedStyle(document.documentElement).fontSize);
            if (!basePx || basePx <= 0 || !isFinite(basePx)) basePx = 16;
            const maxPx = maxHeight / (lineH * numLines);
            if (isFinite(maxPx) && maxPx > 0) {
                fontByHeight = Math.min(absMax, Math.max(minFont, (maxPx / basePx) * 0.95));
            }
        }

        let finalFont = Math.max(minFont, Math.min(fontByWidth, fontByHeight));
        if (!isFinite(finalFont) || finalFont <= 0) finalFont = minFont;

        lyricContent.style.fontSize = `${finalFont}rem`;
        lyricContent.style.lineHeight = lineH;
        lyricContent.style.letterSpacing = letterSpacing;
    }

    let fontTimer = null;
    function scheduleLyricResize() {
        if (fontTimer) cancelAnimationFrame(fontTimer);
        fontTimer = requestAnimationFrame(() => resizeLyricsToFitViewport());
    }

    function updateSectionBadgeAppearance(name) {
        sectionNameBadge.classList.toggle('visible', !!name);
    }

    const LYRIC_TAG_CLASSES = {
        C1: 'lyric-highlight-primary',
        F1: 'lyric-italic-emphasis'
    };
    const LYRIC_TAG_PATTERN = /\[(C1|F1)\]([\s\S]*?)\[\/\1\]/g;

    function renderLyricMarkup(text) {
        if (!text) return '';
        // Iterate so nested tags (e.g. [C1][F1]…[/F1]…[/C1]) render at every level
        let out = escapeHtmlText(text);
        let prev;
        do {
            prev = out;
            out = out.replace(LYRIC_TAG_PATTERN, (match, tag, content) =>
                `<span class="${LYRIC_TAG_CLASSES[tag]}">${content}</span>`);
        } while (out !== prev);
        return out;
    }

    function removeLyricFormattingTags(text) {
        if (!text) return '';
        return text.replace(LYRIC_TAG_PATTERN, '$2');
    }

    function renderCurrentSong() {
        const prevSong = lyricDisplayPanel.dataset.activeSong;
        if (currentSong?.sections?.[currentSectionIndex]) {
            const sec = currentSong.sections[currentSectionIndex];
            sectionNameBadge.innerHTML = renderLyricMarkup(sec.name);
            updateSectionBadgeAppearance(removeLyricFormattingTags(sec.name));
            lyricContent.innerHTML = renderLyricMarkup(sec.lyrics);
            lyricDisplayPanel.classList.add('song-selected');
        } else if (currentSong) {
            sectionNameBadge.textContent = '';
            updateSectionBadgeAppearance(null);
            lyricContent.innerHTML = '<span class="end-of-song-marker">End of song</span>';
            lyricDisplayPanel.classList.add('song-selected');
        } else {
            sectionNameBadge.textContent = '';
            updateSectionBadgeAppearance(null);
            lyricContent.innerText = '';
            lyricDisplayPanel.classList.remove('song-selected');
            welcomeMessage.classList.add('visible');
        }

        if (currentSong) {
            welcomeMessage.classList.remove('visible');
        }
        // Keep the update prompt off the projector while a song is up
        updateBanner.classList.toggle('visible', updateAvailable && !currentSong);
        scheduleLyricResize();
        updateSectionCounter();
        updateSongSearchBar();

        const newSong = currentSong?.title || '';
        if (prevSong !== newSong) {
            lyricDisplayPanel.dataset.activeSong = newSong;
            renderSongSearchResults(currentSearchTerm);
        }
    }

    async function selectSongForPresentation(song) {
        if (!song) return;
        document.body.classList.remove('home-screen-active');
        currentSong = song;
        currentSectionIndex = 0;
        renderCurrentSong();
        hideSongSearchResults();
        keepScreenAwake();

        if (!document.fullscreenElement) {
            try {
                await document.documentElement.requestFullscreen();
                lockLandscapeOrientation();
            } catch {}
        } else {
            lockLandscapeOrientation();
        }
        scheduleLyricResize();
    }

    function transitionBetweenSections(direction, callback) {
        const outClass = direction === 'next' ? 'section-transition-next-exit' : 'section-transition-previous-exit';
        const inClass  = direction === 'next' ? 'section-transition-next-enter'  : 'section-transition-previous-enter';
        isTransitioning = true;
        lyricContent.classList.add(outClass);
        setTimeout(() => {
            callback();
            lyricContent.classList.remove(outClass);
            lyricContent.classList.add(inClass);
            requestAnimationFrame(() => {
                setTimeout(() => {
                    lyricContent.classList.remove(inClass);
                    isTransitioning = false;
                }, 15);
            });
        }, 120);
    }

    function showNextSection() {
        if (isTransitioning) return;
        if (currentSong?.sections && currentSectionIndex + 1 < currentSong.sections.length) {
            transitionBetweenSections('next', () => {
                currentSectionIndex++;
                renderCurrentSong();
            });
        } else if (currentSong?.sections && currentSectionIndex + 1 >= currentSong.sections.length) {
            lyricContent.classList.remove('end-of-song-feedback');
            void lyricContent.offsetWidth;
            lyricContent.classList.add('end-of-song-feedback');
            sectionCounter.classList.remove('end-of-song-feedback');
            void sectionCounter.offsetWidth;
            sectionCounter.classList.add('end-of-song-feedback');
        }
    }

    function showPreviousSection() {
        if (isTransitioning) return;
        if (currentSectionIndex > 0) {
            transitionBetweenSections('prev', () => {
                currentSectionIndex--;
                renderCurrentSong();
            });
        }
    }

    function renderSongSearchResults(term = "") {
        highlightedSearchIndex = -1;
        songSearchInput.removeAttribute('aria-activedescendant');
        if (!songDatabase.length) {
            songSearchResults.innerHTML = `<div class="search-empty-message">No songs available</div>`;
            return;
        }
        const filtered = filterSongsByTitle(term);
        if (!filtered.length) {
            songSearchResults.innerHTML = `<div class="search-empty-message">No song titles match “${escapeHtmlText(term.trim())}”</div>`;
            return;
        }
        songSearchResults.innerHTML = '';
        let activeEl = null;
        const fragment = document.createDocumentFragment();

        const countDiv = document.createElement('div');
        countDiv.className = 'search-result-count';
        countDiv.textContent = `${filtered.length} ${filtered.length === 1 ? 'song' : 'songs'}`;
        fragment.appendChild(countDiv);

        const query = normalizeSearchText(term.trim());
        filtered.forEach((song, index) => {
            const div = document.createElement('div');
            div.className = 'song-search-result';
            const titleDiv = document.createElement('div');
            const isActive = currentSong?.title === song.title;
            titleDiv.className = 'song-search-result-title' + (isActive ? ' selected-song' : '');
            titleDiv.id = `song-option-${index}`;
            titleDiv.setAttribute('role', 'option');
            titleDiv.setAttribute('aria-selected', isActive);
            const match = query ? findTitleMatchRange(song.title, query) : null;
            if (match) {
                const [start, end] = match;
                const titleSpan = document.createElement('span');
                const mark = document.createElement('mark');
                mark.textContent = song.title.slice(start, end);
                titleSpan.append(song.title.slice(0, start), mark, song.title.slice(end));
                titleDiv.appendChild(titleSpan);
            } else {
                titleDiv.textContent = song.title;
            }
            titleDiv.onclick = () => {
                selectSongForPresentation(song);
            };
            div.appendChild(titleDiv);
            fragment.appendChild(div);
            if (isActive) {
                activeEl = div;
                // Arrow keys step from the song on screen (it is not highlighted, so Enter still picks the first result)
                if (!query) highlightedSearchIndex = index;
            }
        });
        songSearchResults.appendChild(fragment);
        if (activeEl) {
            if (query) {
                activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            } else {
                // Unfiltered list: put the song on screen at the top of the dropdown
                songSearchResults.scrollTop = activeEl.offsetTop - parseFloat(getComputedStyle(songSearchResults).paddingTop);
            }
        }
    }

    // Shared by the search-bar press and Alt+Shift+F. With a song up, start from an empty box;
    // the song keeps showing until a new one is selected.
    function openSongSearch() {
        if (currentSong) {
            currentSearchTerm = '';
            songSearchInput.value = '';
            clearSongSearchButton.classList.remove('visible');
            songSearchBar.classList.remove('song-selected');
            resetSongSearchBarWidth();
        }
        songSearchInput.focus();
        renderSongSearchResults(currentSearchTerm);
        showSongSearchResults();
    }

    function moveSearchResultHighlight(direction) {
        const songElements = [...songSearchResults.querySelectorAll('.song-search-result-title')];
        if (!songElements.length) return;

        highlightedSearchIndex = (highlightedSearchIndex + direction + songElements.length) % songElements.length;
        songElements.forEach((element, index) => {
            element.classList.toggle('keyboard-highlighted', index === highlightedSearchIndex);
        });
        songElements[highlightedSearchIndex].scrollIntoView({ block: 'nearest' });
        songSearchInput.setAttribute('aria-activedescendant', songElements[highlightedSearchIndex].id);
    }

    function initializeKeyboardControls() {
        document.addEventListener('keydown', e => {
            if (e.altKey && e.shiftKey && e.code === 'KeyH') {
                e.preventDefault();
                showHomeScreen();
                return;
            }
            if (e.altKey && e.shiftKey && e.code === 'KeyF') {
                e.preventDefault();
                openSongSearch();
                return;
            }
            if (document.activeElement?.id === 'songSearchInput') {
                if (e.key === 'Escape') {
                    songSearchInput.blur();
                    hideSongSearchResults();
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    moveSearchResultHighlight(1);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    moveSearchResultHighlight(-1);
                } else if (e.key === 'Enter') {
                    const songElements = [...songSearchResults.querySelectorAll('.song-search-result-title')];
                    const selectedIndex = Math.max(0, songElements.findIndex(el => el.classList.contains('keyboard-highlighted')));
                    if (songElements[selectedIndex]) {
                        e.preventDefault();
                        songElements[selectedIndex].click();
                    }
                }
                return;
            }
            // Presenter remotes send PageUp/PageDown (some send Space); only while a song is up so Space still presses buttons on the welcome screen
            if (currentSong && ['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); showNextSection(); }
            else if (currentSong && ['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); showPreviousSection(); }
            else if (!isTransitioning && currentSong?.sections?.length && (e.key === 'Home' || e.key === 'End')) {
                e.preventDefault();
                currentSectionIndex = e.key === 'Home' ? 0 : currentSong.sections.length - 1;
                renderCurrentSong();
            }
            else if (e.key === 'Escape') {
                e.preventDefault();
                if (songSearchResults.classList.contains('visible')) {
                    hideSongSearchResults();
                } else if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
            }
        });
    }

    function initializeSongSearch() {
        let debounce;
        songSearchInput.addEventListener('input', e => {
            clearTimeout(debounce);
            const val = e.target.value;
            clearSongSearchButton.classList.toggle('visible', val.length > 0);
            songSearchBar.classList.remove('song-selected');
            debounce = setTimeout(() => {
                currentSearchTerm = val;
                renderSongSearchResults(currentSearchTerm);
                showSongSearchResults();
            }, 100);
        });
        // Disable double-click word-highlight; text is selected by click-hold-drag only
        songSearchInput.addEventListener('mousedown', e => {
            if (e.detail > 1) e.preventDefault();
        });
        songSearchInput.addEventListener('focus', () => {
            renderSongSearchResults(currentSearchTerm);
            showSongSearchResults();
        });
        clearSongSearchButton.addEventListener('click', (e) => {
            e.stopPropagation();
            songSearchInput.value = '';
            clearSongSearchButton.classList.remove('visible');
            currentSearchTerm = '';
            renderSongSearchResults('');
            songSearchInput.focus();
        });
        songSearchContainer.addEventListener('pointerdown', (e) => {
            if (e.target === clearSongSearchButton) return;
            if (songSearchResults.contains(e.target)) return; // let dropdown item clicks work
            if (e.target === songSearchInput) {
                // Press directly on the text: leave it untouched so the user can
                // place the caret or click-hold-drag to highlight and edit it.
                return;
            }
            // Focus on press (not click) so a press anywhere in the search area — incl. the
            // rounded-pill corners that fall outside the pill itself — still opens search.
            e.preventDefault();
            openSongSearch();
        });

        // Click outside closes dropdown
        document.addEventListener('click', e => {
            if (!songSearchContainer.contains(e.target)) {
                hideSongSearchResults();
            }
        });
    }

    function togglePresentationFullscreen() {
        // iPhone Safari has no element fullscreen; denied requests reject
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
        } else {
            document.documentElement.requestFullscreen?.().catch(() => {});
        }
    }

    let screenWakeLock = null;
    async function keepScreenAwake() {
        if (!currentSong || screenWakeLock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
        try {
            screenWakeLock = await navigator.wakeLock.request('screen');
            screenWakeLock.addEventListener('release', () => { screenWakeLock = null; });
        } catch {}
    }

    function releaseScreenWakeLock() {
        screenWakeLock?.release().catch(() => {});
        screenWakeLock = null;
    }

    function lockLandscapeOrientation() {
        if (screen.orientation?.lock) {
            screen.orientation.lock('landscape').catch(() => {});
        }
    }

    function unlockScreenOrientation() {
        if (screen.orientation?.unlock) {
            screen.orientation.unlock();
        }
    }

    function initializeFullscreenControls() {
        document.addEventListener('dblclick', (e) => {
            // Anywhere except the search bar/dropdown (typing & picking songs) and the welcome card buttons
            if (songSearchContainer.contains(e.target) || welcomeMessage.contains(e.target)) return;
            togglePresentationFullscreen();
        });
        let cursorHideTimer = null;

        const showCursorTemporarily = () => {
            document.documentElement.classList.remove('presentation-cursor-hidden');
            clearTimeout(cursorHideTimer);
            if (document.fullscreenElement) {
                cursorHideTimer = setTimeout(() => {
                    document.documentElement.classList.add('presentation-cursor-hidden');
                }, 1000);
            }
        };

        document.addEventListener('mousemove', showCursorTemporarily);
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                lockLandscapeOrientation();
                showCursorTemporarily();
            } else {
                unlockScreenOrientation();
                // In fullscreen the browser consumes Esc to exit, so our keydown never fires; close search here instead
                if (songSearchResults.classList.contains('visible') || document.activeElement === songSearchInput) {
                    songSearchInput.blur();
                    hideSongSearchResults();
                }
                clearTimeout(cursorHideTimer);
                document.documentElement.classList.remove('presentation-cursor-hidden');
            }
            if (currentSong) scheduleLyricResize();
        });
    }

    function initializeTouchGestures() {
        let startX, startY, lastTap = 0, lastTapX = 0, lastTapY = 0;
        presentationStage.addEventListener('touchstart', e => {
            const t = e.touches[0];
            startX = t.clientX; startY = t.clientY;
        }, { passive: true });
        presentationStage.addEventListener('touchend', e => {
            const t = e.changedTouches[0];
            if (!t || welcomeMessage.contains(e.target)) return;
            const dx = t.clientX - startX, dy = t.clientY - startY;
            const isSwipe = Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5;
            if (isSwipe) {
                e.preventDefault();
                dx > 0 ? showPreviousSection() : showNextSection();
                lastTap = 0;
                return;
            }
            const now = Date.now();
            const dist = Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY);
            if (now - lastTap < 300 && dist < 30) {
                e.preventDefault();
                togglePresentationFullscreen();
                lastTap = 0;
            } else {
                lastTap = now;
                lastTapX = t.clientX;
                lastTapY = t.clientY;
            }
        }, { passive: false });
    }

    function initializeResizeHandling() {
        window.addEventListener('resize', () => {
            if (currentSong?.sections?.[currentSectionIndex]) scheduleLyricResize();
            if (currentSong) fitSearchBarToSongTitle(currentSong.title);
        });
    }

    function showHomeScreen() {
        document.body.classList.add('home-screen-active');
        currentSong = null;
        currentSectionIndex = 0;
        songSearchInput.value = '';
        selectedSongTitle.textContent = '';
        currentSearchTerm = '';
        clearSongSearchButton.classList.remove('visible');
        songSearchBar.classList.remove('song-selected');
        resetSongSearchBarWidth();
        renderCurrentSong();
        hideSongSearchResults();
        releaseScreenWakeLock();
    }

    function initializeLyricLoadHandling() {
        window.addEventListener('load', () => currentSong && scheduleLyricResize());
    }

    function measureSelectedSongTitleWidth(text) {
        const cs = getComputedStyle(selectedSongTitle);
        lyricMeasureSpan.style.fontFamily = cs.fontFamily;
        lyricMeasureSpan.style.fontSize = cs.fontSize;
        lyricMeasureSpan.style.fontWeight = cs.fontWeight;
        lyricMeasureSpan.style.fontStyle = cs.fontStyle;
        lyricMeasureSpan.style.letterSpacing = cs.letterSpacing;
        lyricMeasureSpan.style.textTransform = cs.textTransform;
        lyricMeasureSpan.textContent = text || '';
        return lyricMeasureSpan.getBoundingClientRect().width;
    }

    function fitSearchBarToSongTitle(title) {
        const textW = measureSelectedSongTitleWidth(title);
        const barStyle = getComputedStyle(songSearchBar);
        const padL = parseFloat(barStyle.paddingLeft) || 0;
        const padR = parseFloat(barStyle.paddingRight) || 0;
        // text width + actual horizontal padding + comfort buffer, with a sensible minimum
        const pill = Math.max(180, Math.ceil(textW) + padL + padR + 14);
        document.documentElement.style.setProperty('--search-pill-w', pill + 'px');
    }

    function resetSongSearchBarWidth() {
        document.documentElement.style.setProperty('--search-pill-w', '720px');
    }

    function initializeApplication() {
        initializeBackgroundControls();
        initializeSongSearch();
        initializeKeyboardControls();
        initializeFullscreenControls();
        initializeResizeHandling();
        initializeLyricLoadHandling();
        initializeTouchGestures();
        // The browser drops the wake lock when the tab is hidden; take it back on return
        document.addEventListener('visibilitychange', keepScreenAwake);
        renderCurrentSong();
        // Re-measure the title pill with the real font once it loads
        if (document.fonts?.ready) document.fonts.ready.then(() => currentSong ? fitSearchBarToSongTitle(currentSong.title) : resetSongSearchBarWidth());
        loadSavedCustomBackground();
    }

    initializeApplication();
</script>
<script>
if ('serviceWorker' in navigator) {
  // First-ever install also posts UPDATE_AVAILABLE; only a page already controlled by an older worker has an update
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js');
  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data?.type === 'UPDATE_AVAILABLE' && hadController) {
      updateAvailable = true;
      updateBanner.onclick = () => {
        window.location.reload();
      };
      updateBanner.classList.toggle('visible', !currentSong);
    }
  });
}
</script>
</body>
</html>
